<!doctype html><html lang="en"><meta charset="utf-8"><title>Rustlas · Frontier artwork checks</title><style>body{background:#151416;color:#eddbba;font:14px system-ui;margin:24px}h1{font-size:26px}#grid{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:10px}.card{background:linear-gradient(#4c3d37,#221c1c);border:1px solid #6c5042;border-radius:6px;text-align:center;padding:6px}canvas{width:100%;height:140px;object-fit:contain}#walk{width:100%;height:170px;background:#352e29}p{color:#d9bd91}</style><h1>Big Money Rustlas · New frontier artwork</h1><p id="status">Preparing assets…</p><canvas id="walk" width="1280" height="170"></canvas><div id="grid"></div><script type="module">
import {ASSETS,FRAMES} from '../src/assets.js';import {prepareArtwork} from '../src/presentation.js';
const imgs={};await Promise.all([...new Set(Object.values(FRAMES).map(f=>f.sheet))].map(async name=>{const im=new Image();im.src='../'+ASSETS[name];await im.decode();imgs[name]=im;}));const art=await prepareArtwork(imgs,FRAMES);
const names=Object.keys(FRAMES).filter(n=>/^(prop_|sugar_walk|foot_|poot_|chips_|raider_)/.test(n));
const draw=(c,name,x,y,h)=>{const v=art.views[name],w=v.width/v.height*h;c.drawImage(v,x-w/2,y-h,w,h);};
for(const name of names){const card=document.createElement('div');card.className='card';const cv=document.createElement('canvas');cv.width=220;cv.height=160;draw(cv.getContext('2d'),name,110,150,140);const p=document.createElement('div');p.textContent=name.replaceAll('_',' ');card.append(cv,p);document.querySelector('#grid').append(card);}
const cv=document.querySelector('#walk'),c=cv.getContext('2d');function frame(t){c.clearRect(0,0,1280,170);c.strokeStyle='#a48960';c.beginPath();c.moveTo(0,145);c.lineTo(1280,145);c.stroke();for(let i=0;i<6;i++)draw(c,'sugar_walk'+((Math.floor(t/95)+i)%6),80+i*205,145,109);requestAnimationFrame(frame);}requestAnimationFrame(frame);
document.querySelector('#status').textContent=names.length+' fresh prop and character frames · six-frame walking cycle at game size';
</script></html>
