<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17130f">
  <meta name="description" content="The first official Big Money Rustlas video game. Ride as Sugar Wolf through eight chapters of Western action, collect lost badges, and take Mud Bug back from Big Baby Chips.">
  <title>Big Money Rustlas — The Official Game</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <canvas id="game" width="1280" height="720" aria-label="Big Money Rustlas action platformer. Controls are available in the field guide."></canvas>
    <div id="vignette" aria-hidden="true"></div>
    <div id="hud" hidden>
      <div class="hud-left"><span class="eyebrow">SUGAR WOLF</span><div id="health" aria-label="Health"></div><div id="shield" class="tiny"></div></div>
      <div class="hud-middle"><span id="chapter-label" class="eyebrow"></span><strong id="place-label"></strong><div class="trail"><i id="trail-fill"></i></div></div>
      <div class="hud-right"><span id="gold">0</span><span class="gold-icon">◈</span><button id="pause" class="icon-button" aria-label="Pause game" title="Pause (Escape)">Ⅱ</button></div>
      <div id="weapon"><div id="rounds"></div><span id="weapon-label"></span><div id="reload-track"><i></i></div></div>
      <div id="badges" aria-label="Lost badges collected"></div>
      <div id="boss-hud" hidden><div><span id="boss-name"></span><span id="boss-state"></span></div><div class="boss-track"><i id="boss-fill"></i></div></div>
      <div id="control-strip"><span><kbd>A</kbd><kbd>D</kbd> Move</span><span><kbd>SPACE</kbd> Jump</span><span><kbd>J</kbd> Shoot</span><span><kbd>K</kbd> Slap</span><span><kbd>R</kbd> Reload</span><span><kbd>SHIFT</kbd> Dodge</span></div>
    </div>
    <section id="menu" aria-label="Main menu"></section>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="hint" role="status"></div>
    <div id="touch" hidden aria-label="Touch controls">
      <div class="touch-move"><button data-hold="left" aria-label="Move left">◀</button><button data-hold="right" aria-label="Move right">▶</button><button data-hold="down" aria-label="Drop through platform" class="small-touch">▼</button></div>
      <div class="touch-actions"><button data-tap="interact" aria-label="Inspect secret" class="small-touch">LOOK</button><button data-tap="reload" aria-label="Reload" class="small-touch">↻</button><button data-tap="roll" aria-label="Dodge" class="small-touch">DODGE</button><button data-hold="slap" aria-label="Slap">SLAP</button><button data-hold="fire" aria-label="Shoot">FIRE</button><button data-hold="jump" aria-label="Jump" class="jump-touch">JUMP</button></div>
    </div>
    <div id="loading"><span class="eyebrow">THE FIRST OFFICIAL VIDEO GAME</span><h1><img src="art/title-wordmark.png" alt="Big Money Rustlas"></h1><div class="loading-track"><i id="loading-progress"></i></div><p id="loading-text">Saddling up…</p><img class="loading-studio" src="art/creaso-norse.png" alt="CREASO·NORSE" width="444" height="90"></div>
    <noscript>This game needs JavaScript enabled to play.</noscript>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
