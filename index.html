<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
<script>
/* LUNATICS ONLY — this game only runs on jcwlunacy.net (for members, who
   open it from the Games page) or inside the JCW Lunacy app. Opened anywhere
   else (the bare github.io link, someone else's page) it shows a sign pointing
   to the site instead. Inside the site the page answers a quick handshake
   ("jcw-pass") that only jcwlunacy.net can send. Local dev servers still work. */
(function(){
  var SITE=/^https:\/\/(www\.)?jcwlunacy\.net$/;
  var h=location.hostname, ua=navigator.userAgent||'';
  if(SITE.test(location.origin)||h===''||h==='localhost'||h==='127.0.0.1'||h==='[::1]')return;
  /* the JCW Lunacy app (Android WebView / iOS WKWebView) gates members itself */
  if(/; wv\)/.test(ua)||(/(iPhone|iPad|iPod)/.test(ua)&&/AppleWebKit/.test(ua)&&!/Safari\//.test(ua)))return;
  var done=false,framed=window.parent!==window,sameParent=false;
  try{sameParent=framed&&window.parent.location.origin===location.origin;}catch(_e){}
  function lock(){
    if(done)return;done=true;window.removeEventListener('message',pass);
    try{window.stop();}catch(_e){}
    var html='<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lunatics Only · JCW Lunacy</title></head>'+
      '<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box">'+
      '<div style="max-width:460px"><div style="font-size:52px">🎪</div>'+
      '<div style="font-size:24px;font-weight:800;color:#ffd028;letter-spacing:.08em;text-transform:uppercase;margin:12px 0 8px">Lunatics Only</div>'+
      '<p style="color:#aab;line-height:1.6;font-size:16px;margin:0 0 20px">This game plays on <b style="color:#fff">jcwlunacy.net</b> for members of The Lunatics Only, and in the JCW Lunacy app.</p>'+
      '<a href="https://jcwlunacy.net/#games" target="_top" style="display:inline-block;background:#ffd028;color:#000;font-weight:800;text-decoration:none;padding:13px 24px;border-radius:10px">Play on jcwlunacy.net</a></div></body>';
    try{document.documentElement.innerHTML=html;}catch(_e){try{document.open();document.write('<!doctype html><html>'+html+'</html>');document.close();}catch(__e){}}
    try{document.querySelectorAll('audio,video').forEach(function(m){m.pause();});}catch(_e){}
  }
  function pass(e){
    if(done||!e||!e.data||e.data.type!=='jcw-pass'||!SITE.test(e.origin)||e.source!==window.parent)return;
    if(e.data.ok){done=true;window.removeEventListener('message',pass);}else lock();
  }
  if(!framed||sameParent){lock();return;}
  window.addEventListener('message',pass);
  try{window.parent.postMessage({type:'jcw-pass-req'},'*');}catch(_e){}
  setTimeout(lock,4000);
})();
</script>
